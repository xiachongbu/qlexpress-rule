<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
  <style>
    text { fill: #0f172a; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 12px; fill: #64748b; }
    .layer { font-size: 13px; font-weight: 700; fill: #334155; }
    .node { font-size: 12.5px; font-weight: 600; }
    .small { font-size: 11px; fill: #64748b; }
    .albl { font-size: 10.5px; fill: #475569; }
  </style>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#ea580c"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#059669"/></marker>
    <marker id="agy" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#6b7280"/></marker>
  </defs>

  <rect x="0" y="0" width="960" height="660" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" class="title">QLExpress 可视化规则引擎 · 系统架构</text>
  <text x="480" y="56" text-anchor="middle" class="sub">管理端编排/发布 · 客户端 SDK 本地执行 · Spring Boot 2 / QLExpress 4</text>

  <!-- Browser -->
  <rect x="70" y="80" width="200" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="170" y="108" text-anchor="middle" class="node">浏览器 · 使用方</text>

  <!-- Frontend -->
  <rect x="70" y="162" width="250" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="195" y="186" text-anchor="middle" class="node">rule-engine-builder-ui</text>
  <text x="195" y="206" text-anchor="middle" class="small">Vue2 独立前端（dist）· 管理控制台</text>

  <!-- Server container -->
  <rect x="40" y="252" width="520" height="196" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5,4"/>
  <text x="52" y="272" class="layer">rule-engine-server · REST API（:8080）</text>
  <rect x="58" y="284" width="234" height="50" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="175" y="305" text-anchor="middle" class="node">管理 API</text>
  <text x="175" y="322" text-anchor="middle" class="small">规则·规则集·变量·函数·字典·日志</text>
  <rect x="308" y="284" width="234" height="50" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="425" y="305" text-anchor="middle" class="node">同步 API</text>
  <text x="425" y="322" text-anchor="middle" class="small">/api/rule/sync/**（Token 鉴权）</text>
  <rect x="58" y="344" width="234" height="50" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="175" y="365" text-anchor="middle" class="node">发布与推送</text>
  <text x="175" y="382" text-anchor="middle" class="small">发布服务 · L2 初始化 · Redis 推送</text>
  <rect x="308" y="344" width="234" height="50" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="425" y="365" text-anchor="middle" class="node">rule-engine-core</text>
  <text x="425" y="382" text-anchor="middle" class="small">QLExpress 编译 / 执行</text>
  <text x="300" y="432" text-anchor="middle" class="small">rule-engine-model：公共实体 / DTO / 常量</text>

  <!-- Business container -->
  <rect x="620" y="162" width="300" height="286" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5,4"/>
  <text x="632" y="182" class="layer">业务应用（Spring Boot）</text>
  <rect x="640" y="196" width="260" height="132" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="770" y="220" text-anchor="middle" class="node">rule-engine-client SDK</text>
  <text x="656" y="244" class="small">• L1 内存缓存 + L2 Redis</text>
  <text x="656" y="266" class="small">• QLExpress 本地执行</text>
  <text x="656" y="288" class="small">• HTTP 同步 + Redis 订阅</text>
  <text x="656" y="310" class="small">• app-name = 项目编码</text>
  <rect x="640" y="342" width="260" height="86" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="770" y="370" text-anchor="middle" class="node">业务代码</text>
  <text x="770" y="392" text-anchor="middle" class="small">ruleClient.execute(ruleCode, 入参)</text>
  <text x="770" y="410" text-anchor="middle" class="small">→ RuleResult</text>

  <!-- Infra container -->
  <rect x="40" y="490" width="880" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5,4"/>
  <text x="52" y="510" class="layer">存储与中间件</text>
  <rect x="90" y="520" width="230" height="50" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="205" y="541" text-anchor="middle" class="node">MySQL</text>
  <text x="205" y="558" text-anchor="middle" class="small">规则/内容/发布/日志/字典</text>
  <rect x="365" y="520" width="220" height="50" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="475" y="541" text-anchor="middle" class="node">Redis</text>
  <text x="475" y="558" text-anchor="middle" class="small">Pub/Sub 推送 + L2 缓存</text>
  <rect x="630" y="520" width="230" height="50" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="745" y="541" text-anchor="middle" class="node">Kafka（可选）</text>
  <text x="745" y="558" text-anchor="middle" class="small">执行日志上报</text>

  <!-- Arrows -->
  <!-- Browser -> UI -->
  <path d="M170,127 L170,160" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <!-- UI -> Server -->
  <path d="M190,223 L190,250" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <rect x="196" y="230" width="66" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="199" y="242" class="albl">REST /api</text>
  <!-- Server -> MySQL -->
  <path d="M205,449 L205,518" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ab)"/>
  <rect x="188" y="475" width="34" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="192" y="487" class="albl">读写</text>
  <!-- Server -> Redis (publish/L2 write) -->
  <path d="M475,449 L475,518" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#ao)"/>
  <rect x="480" y="475" width="76" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="483" y="487" class="albl">发布 · 写 L2</text>
  <!-- SDK -> Server (HTTP sync) -->
  <path d="M638,300 L564,300" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
  <rect x="566" y="284" width="72" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="569" y="296" class="albl">HTTP 同步</text>
  <!-- SDK -> Redis (subscribe / read L2) -->
  <path d="M720,330 L720,505 L562,505 L562,518" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ag)"/>
  <rect x="600" y="497" width="86" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="603" y="509" class="albl">订阅 + 读 L2</text>
  <!-- SDK -> Kafka (async log, optional) -->
  <path d="M815,330 L815,505 L745,505 L745,518" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#agy)"/>
  <rect x="760" y="440" width="70" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="763" y="452" class="albl">日志(可选)</text>
  <!-- business code -> SDK -->
  <path d="M770,341 L770,330" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#ab)"/>

  <!-- Legend -->
  <line x1="60" y1="616" x2="92" y2="616" stroke="#2563eb" stroke-width="2"/>
  <text x="98" y="620" class="albl">请求 / 同步（REST·HTTP）</text>
  <line x1="290" y1="616" x2="322" y2="616" stroke="#ea580c" stroke-width="2"/>
  <text x="328" y="620" class="albl">发布 / 推送</text>
  <line x1="450" y1="616" x2="482" y2="616" stroke="#059669" stroke-width="2"/>
  <text x="488" y="620" class="albl">缓存读写（订阅·L2）</text>
  <line x1="690" y1="616" x2="722" y2="616" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="728" y="620" class="albl">异步日志（可选）</text>
</svg>
