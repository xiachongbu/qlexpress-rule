server:
  port: 7070

# ============================================================
# 规则引擎客户端配置（示例：信贷 / 交易风控场景）
# ============================================================
rule-engine:
  client:
    server-url: http://localhost:8080
    # app-name 必须与规则项目的「项目编码(project_code)」一致：
    # SDK 以它作为同步 projectCode、L1/L2 缓存键前缀与 Redis 推送订阅频道 rule:push:{app-name}。
    # 示例项目（data-example.sql）的项目编码为 RISK_DEMO。
    app-name: ${PROJECT_CODE:RISK_DEMO}
    token: ${PROJECT_ACCESS_TOKEN:88f2ad5ac48544b8bc990d3164f76066}
    l1-cache-max-size: 500
    http-timeout-ms: 3000
    project-id: 1
    # 是否开启表达式追踪，默认 true；生产环境如不需要追踪信息可设为 false 以提升性能
    trace-enabled: true
    # 内置 HTTP 函数(httpCall/httpGet/httpPost)的 host 白名单，逗号分隔或 YAML 列表。
    # 不配置或留空 = 不限制（默认放开，适配调用内网核验服务的场景）；
    # 配置后仅允许列表内的 host 被访问，其余请求直接返回错误、不发起连接。host 大小写不敏感。
    # allow-hosts: api.example.com,10.0.0.10
    # allow-hosts:
    #   - api.example.com
    #   - 10.0.0.10

# ============================================================
# Redis 配置 - SDK 通过 Redis Pub/Sub 接收规则推送
# 需要与 rule-engine-server 使用同一个 Redis 实例
# ============================================================
spring:
  # 默认不启用 Kafka（避免误配外网地址）；需要执行日志上报时再引入 spring.kafka 并删除下行 exclude
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

# ============================================================
# Actuator 健康检查
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.bjjw.rule.client: DEBUG
    com.bjjw.rule.example: DEBUG
